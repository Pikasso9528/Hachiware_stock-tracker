<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>台股強勢股分析儀表板</title>
<style>
  :root {
    --bg: #0b1120;
    --panel: rgba(15, 23, 42, 0.7);
    --border: #1e293b;
    --border-hover: #334155;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --muted2: #64748b;
    --accent: #38bdf8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", Roboto, sans-serif;
  }
  ::-webkit-scrollbar { height: 6px; width: 6px; }
  ::-webkit-scrollbar-thumb { background: var(--border-hover); border-radius: 4px; }

  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px 60px; }
  @media (min-width: 640px) { .wrap { padding: 40px 24px 60px; } }

  header h1 {
    font-size: 1.6rem;
    font-weight: 800;
    margin: 0;
    background: linear-gradient(90deg, #38bdf8, #67e8f9, #34d399);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  @media (min-width: 640px) { header h1 { font-size: 2rem; } }
  header p { color: var(--muted); font-size: 0.85rem; margin: 6px 0 0; }
  header { margin-bottom: 24px; }

  .error-box {
    background: rgba(239,68,68,0.1);
    border: 1px solid rgba(239,68,68,0.4);
    color: #fca5a5;
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 20px;
    font-size: 0.85rem;
  }

  nav.tabs {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 8px;
    margin: 0 -16px 20px;
    padding-left: 16px;
    padding-right: 16px;
  }
  @media (min-width: 640px) { nav.tabs { margin: 0 0 20px; padding-left: 0; padding-right: 0; } }
  .tab-btn {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 9px 14px;
    border-radius: 10px;
    font-size: 0.875rem;
    font-weight: 500;
    border: 1px solid var(--border);
    background: rgba(15,23,42,0.6);
    color: var(--muted);
    cursor: pointer;
    transition: all .15s ease;
    white-space: nowrap;
  }
  .tab-btn:hover { color: var(--text); border-color: var(--border-hover); }
  .tab-btn.active {
    background: rgba(56,189,248,0.15);
    border-color: rgba(56,189,248,0.5);
    color: #7dd3fc;
  }
  .tab-btn .count { opacity: 0.7; font-size: 0.75rem; }

  .empty {
    text-align: center;
    padding: 70px 16px;
    color: var(--muted2);
  }
  .empty .icon { font-size: 2.5rem; margin-bottom: 10px; }

  .grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
  }
  @media (min-width: 640px) { .grid { grid-template-columns: 1fr 1fr; } }
  @media (min-width: 1024px) { .grid { grid-template-columns: 1fr 1fr 1fr; } }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,.35); }

  .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .stock-name {
    font-weight: 600;
    color: var(--text);
    text-decoration: none;
    display: block;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .stock-name:hover { color: var(--accent); text-decoration: underline; }
  .stock-sub { font-size: 0.75rem; color: var(--muted2); margin-top: 2px; }

  .badges { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }
  .badge {
    padding: 2px 10px;
    border-radius: 999px;
    font-size: 0.75rem;
    font-weight: 500;
    white-space: nowrap;
    border: 1px solid;
  }
  .badge-warn {
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 0.68rem;
    white-space: nowrap;
    background: rgba(239,68,68,0.15);
    color: #fca5a5;
    border: 1px solid rgba(239,68,68,0.4);
  }

  .card-bottom { display: flex; align-items: center; justify-content: space-between; }
  .stars { display: flex; align-items: center; gap: 3px; font-size: 1.05rem; line-height: 1; }
  .stars span.dim { opacity: 0.8; }
  .added-date { font-size: 0.68rem; color: var(--muted2); }

  footer {
    margin-top: 48px;
    text-align: center;
    font-size: 0.72rem;
    color: #475569;
    line-height: 1.6;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>台股強勢股分析儀表板</h1>
    <p id="meta">載入中...</p>
  </header>

  <div id="errorBox" style="display:none" class="error-box"></div>

  <nav class="tabs" id="tabs"></nav>

  <div id="content"></div>

  <footer>
    <p>近5日強度星星：左（今日）→ 右（4日前）　★金＝偏強/極強　☆灰＝中立　★深＝偏弱/弱　❓＝未更新</p>
    <p>資料來源：TWSE / TPEX 三大法人買賣超公開資訊，僅供參考，不構成投資建議。</p>
  </footer>
</div>

<script>
(function () {
  "use strict";

  var TABS = [
    { key: "focus",    label: "焦點監控",     icon: "🎯" },
    { key: "alpha",    label: "α動能",        icon: "⚡" },
    { key: "pullback", label: "回檔型",       icon: "📉" },
    { key: "super",    label: "當日 Super",   icon: "🌟" },
    { key: "pool",     label: "累加型監控池", icon: "🗂️" }
  ];

  var STRENGTH_STYLE = {
    "極強": "background:rgba(251,191,36,0.15);color:#fcd34d;border-color:rgba(251,191,36,0.4)",
    "偏強": "background:rgba(244,63,94,0.15);color:#fda4af;border-color:rgba(244,63,94,0.4)",
    "中立": "background:rgba(100,116,139,0.15);color:#cbd5e1;border-color:rgba(100,116,139,0.4)",
    "偏弱": "background:rgba(16,185,129,0.15);color:#6ee7b7;border-color:rgba(16,185,129,0.4)",
    "弱":   "background:rgba(5,150,105,0.15);color:#34d399;border-color:rgba(5,150,105,0.4)",
    "未更新": "background:rgba(51,65,85,0.4);color:#94a3b8;border-color:rgba(71,85,105,0.4)"
  };

  var STAR_COLOR = {
    gold: "#fbbf24",
    neutral: "#64748b",
    dark: "#10b981",
    unknown: "#475569"
  };

  var state = { data: null, error: null, activeTab: "focus" };

  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    attrs = attrs || {};
    for (var k in attrs) {
      if (k === "text") node.textContent = attrs[k];
      else if (k === "html") node.innerHTML = attrs[k];
      else if (k === "style") node.setAttribute("style", attrs[k]);
      else if (k.indexOf("on") === 0 && typeof attrs[k] === "function") node.addEventListener(k.slice(2), attrs[k]);
      else node.setAttribute(k, attrs[k]);
    }
    (children || []).forEach(function (c) { if (c) node.appendChild(c); });
    return node;
  }

  function yahooUrl(code, market) {
    var suffix = market === "TWO" ? "TWO" : "TW";
    return "https://tw.stock.yahoo.com/quote/" + code + "." + suffix;
  }

  function renderStars(stars) {
    var row = el("div", { class: "stars", title: "近5日強度（左：今日 → 右：4日前）" });
    stars.forEach(function (s, i) {
      var span = el("span", {
        style: "color:" + (STAR_COLOR[s.color] || "#475569") + (i === 0 ? ";transform:scale(1.15);display:inline-block" : ""),
        class: i === 0 ? "" : "dim",
        text: s.symbol
      });
      row.appendChild(span);
    });
    return row;
  }

  function renderCard(stock, isPool) {
    var badgeStyle = STRENGTH_STYLE[stock.today_strength] || STRENGTH_STYLE["未更新"];
    var badges = el("div", { class: "badges" }, [
      el("span", { class: "badge", style: badgeStyle, text: stock.today_strength }),
      (isPool && stock.warned) ? el("span", { class: "badge-warn", text: "⚠ 即將剔除" }) : null
    ]);

    var top = el("div", { class: "card-top" }, [
      el("div", { style: "min-width:0" }, [
        el("a", {
          class: "stock-name", href: yahooUrl(stock.code, stock.market),
          target: "_blank", rel: "noopener noreferrer", text: stock.name
        }),
        el("div", { class: "stock-sub", text: stock.code + " · " + (stock.market === "TWO" ? "上櫃" : "上市") })
      ]),
      badges
    ]);

    var bottom = el("div", { class: "card-bottom" }, [
      renderStars(stock.stars),
      (isPool && stock.added_date) ? el("span", { class: "added-date", text: "納入 " + stock.added_date }) : el("span")
    ]);

    return el("div", { class: "card" }, [top, bottom]);
  }

  function renderTabs() {
    var nav = document.getElementById("tabs");
    nav.innerHTML = "";
    TABS.forEach(function (t) {
      var count = state.data && state.data.tabs && state.data.tabs[t.key] ? state.data.tabs[t.key].length : null;
      var btn = el("button", {
        class: "tab-btn" + (state.activeTab === t.key ? " active" : ""),
        onclick: function () { state.activeTab = t.key; render(); }
      }, [
        el("span", { text: t.icon }),
        el("span", { text: t.label }),
        count !== null ? el("span", { class: "count", text: "(" + count + ")" }) : null
      ]);
      nav.appendChild(btn);
    });
  }

  function renderContent() {
    var content = document.getElementById("content");
    content.innerHTML = "";
    if (!state.data) return;

    var list = (state.data.tabs && state.data.tabs[state.activeTab]) || [];
    if (list.length === 0) {
      content.appendChild(el("div", { class: "empty" }, [
        el("div", { class: "icon", text: "📭" }),
        el("p", { text: "目前此分頁尚無資料，請確認截圖資料夾或稍後再試。" })
      ]));
      return;
    }

    var grid = el("div", { class: "grid" });
    list.forEach(function (stock) {
      grid.appendChild(renderCard(stock, state.activeTab === "pool"));
    });
    content.appendChild(grid);
  }

  function render() {
    var meta = document.getElementById("meta");
    meta.textContent = state.data
      ? "資料日期：" + state.data.date + "　更新時間：" + state.data.generated_at
      : "載入中...";

    var errorBox = document.getElementById("errorBox");
    if (state.error) {
      errorBox.style.display = "block";
      errorBox.textContent = "載入資料失敗：" + state.error + "（請確認 today_summary.json 是否存在於 docs/ 目錄）";
    } else {
      errorBox.style.display = "none";
    }

    renderTabs();
    renderContent();
  }

  render();

  fetch("./today_summary.json", { cache: "no-store" })
    .then(function (res) {
      if (!res.ok) throw new Error("找不到 today_summary.json");
      return res.json();
    })
    .then(function (json) { state.data = json; render(); })
    .catch(function (e) { state.error = e.message; render(); });
})();
</script>
</body>
</html>
