<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Elevator to Freedom</title>
<style>
  :root {
    --bg: #0b1120;
    --panel: rgba(15, 23, 42, 0.7);
    --border: #1e293b;
    --border-hover: #334155;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --muted2: #64748b;
    --accent: #38bdf8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", Roboto, sans-serif;
  }
  ::-webkit-scrollbar { height: 6px; width: 6px; }
  ::-webkit-scrollbar-thumb { background: var(--border-hover); border-radius: 4px; }

  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px 60px; }
  @media (min-width: 640px) { .wrap { padding: 40px 24px 60px; } }

  header h1 {
    font-size: 1.6rem;
    font-weight: 800;
    margin: 0;
    background: linear-gradient(90deg, #38bdf8, #67e8f9, #34d399);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  @media (min-width: 640px) { header h1 { font-size: 2rem; } }
  header p { color: var(--muted); font-size: 0.85rem; margin: 6px 0 0; }
  header {
    margin-bottom: 24px;
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }

  .date-picker { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .date-picker label { font-size: 0.75rem; color: var(--muted); white-space: nowrap; }
  .date-picker select {
    background: rgba(15,23,42,0.7);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 0.85rem;
    cursor: pointer;
  }
  .date-picker select:hover { border-color: var(--border-hover); }
  .date-picker select:disabled { opacity: 0.5; cursor: default; }

  .error-box {
    background: rgba(239,68,68,0.1);
    border: 1px solid rgba(239,68,68,0.4);
    color: #fca5a5;
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 20px;
    font-size: 0.85rem;
  }

  nav.tabs {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 8px;
    margin: 0 -16px 20px;
    padding-left: 16px;
    padding-right: 16px;
  }
  @media (min-width: 640px) { nav.tabs { margin: 0 0 20px; padding-left: 0; padding-right: 0; } }
  .tab-btn {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 9px 14px;
    border-radius: 10px;
    font-size: 0.875rem;
    font-weight: 500;
    border: 1px solid var(--border);
    background: rgba(15,23,42,0.6);
    color: var(--muted);
    cursor: pointer;
    transition: all .15s ease;
    white-space: nowrap;
  }
  .tab-btn:hover { color: var(--text); border-color: var(--border-hover); }
  .tab-btn.active {
    background: rgba(56,189,248,0.15);
    border-color: rgba(56,189,248,0.5);
    color: #7dd3fc;
  }
  .tab-btn .count { opacity: 0.7; font-size: 0.75rem; }

  .empty {
    text-align: center;
    padding: 70px 16px;
    color: var(--muted2);
  }
  .empty .icon { font-size: 2.5rem; margin-bottom: 10px; }

  .rows {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .stock-row {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 20px;
    transition: border-color .12s ease;
  }
  .stock-row:hover { border-color: var(--border-hover); }

  .row-rank {
    flex-shrink: 0;
    width: 28px;
    text-align: center;
    font-weight: 700;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
  }

  .row-id { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1 1 220px; }
  .row-market {
    flex-shrink: 0;
    font-size: 0.7rem;
    color: var(--muted2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 1px 6px;
  }
  .row-code { flex-shrink: 0; font-size: 0.8rem; color: var(--muted); }
  .stock-name {
    font-weight: 600;
    color: var(--text);
    text-decoration: none;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
  }
  .stock-name:hover { color: var(--accent); text-decoration: underline; }

  .row-field { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; flex-shrink: 0; }
  .row-field .field-label { font-size: 0.65rem; color: var(--muted2); }

  .badge {
    padding: 2px 10px;
    border-radius: 999px;
    font-size: 0.75rem;
    font-weight: 500;
    white-space: nowrap;
    border: 1px solid;
  }
  .pct-badge {
    padding: 2px 10px;
    border-radius: 999px;
    font-size: 0.8rem;
    font-weight: 600;
    white-space: nowrap;
    border: 1px solid;
    font-variant-numeric: tabular-nums;
  }
  .pct-up {
    background: rgba(244,63,94,0.15);
    color: #fda4af;
    border-color: rgba(244,63,94,0.4);
  }
  .pct-down {
    background: rgba(16,185,129,0.15);
    color: #6ee7b7;
    border-color: rgba(16,185,129,0.4);
  }

  .badge-warn {
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 0.68rem;
    white-space: nowrap;
    background: rgba(239,68,68,0.15);
    color: #fca5a5;
    border: 1px solid rgba(239,68,68,0.4);
    flex-shrink: 0;
    margin-left: auto;
  }
  .badge-pinned {
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 0.68rem;
    white-space: nowrap;
    background: rgba(56,189,248,0.15);
    color: #7dd3fc;
    border: 1px solid rgba(56,189,248,0.4);
    flex-shrink: 0;
    margin-left: auto;
  }

  .stars { display: flex; align-items: center; gap: 3px; font-size: 1.05rem; line-height: 1; }
  .stars span.dim { opacity: 0.8; }
  .added-date { font-size: 0.78rem; color: var(--text); }

  .group-row-wrap { display: flex; flex-direction: column; }
  .group-row { cursor: pointer; }
  .group-row.expanded { border-color: rgba(56,189,248,0.5); border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
  .expand-caret { color: var(--muted2); font-size: 0.7rem; width: 10px; flex-shrink: 0; }

  .group-detail {
    border: 1px solid rgba(56,189,248,0.5);
    border-top: none;
    border-radius: 0 0 12px 12px;
    background: rgba(15,23,42,0.4);
    padding: 6px 16px 12px 46px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .detail-row { display: flex; align-items: center; gap: 10px; padding: 5px 0; }
  .detail-rank { color: var(--muted); font-size: 0.8rem; width: 18px; flex-shrink: 0; }
  .detail-name {
    flex: 1;
    min-width: 0;
    font-weight: 500;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .group-detail-empty { color: var(--muted2); font-style: italic; font-size: 0.85rem; padding: 8px 0; }

  footer {
    margin-top: 48px;
    text-align: center;
    font-size: 0.72rem;
    color: #475569;
    line-height: 1.6;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Elevator to Freedom</h1>
      <p id="meta">載入中...</p>
    </div>
    <div class="date-picker">
      <label for="dateSelect">資料日期</label>
      <select id="dateSelect" disabled></select>
    </div>
  </header>

  <div id="errorBox" style="display:none" class="error-box"></div>

  <nav class="tabs" id="tabs"></nav>

  <div id="content"></div>

  <footer>
    <p>近5日強度星星：左（今日）→ 右（4日前）　★金＝偏強/極強　☆灰＝中立　★深＝偏弱/弱　❓＝未更新</p>
    <p>資料來源：TWSE / TPEX 三大法人買賣超公開資訊，僅供參考，不構成投資建議。</p>
  </footer>
</div>

<script>
(function () {
  "use strict";

  var TABS = [
    { key: "focus",    label: "Focus",        icon: "🎯" },
    { key: "alpha",    label: "alpha power",  icon: "⚡" },
    { key: "pullback", label: "pullback",     icon: "📉" },
    { key: "super",        label: "Super Man",     icon: "🌟" },
    { key: "stock_future", label: "stock future",  icon: "📈" },
    { key: "group",        label: "Circle group",  icon: "🧩" },
    { key: "pool",         label: "watchout pool", icon: "🗂️" }
  ];

  var STRENGTH_STYLE = {
    "極強": "background:rgba(251,191,36,0.15);color:#fcd34d;border-color:rgba(251,191,36,0.4)",
    "偏強": "background:rgba(244,63,94,0.15);color:#fda4af;border-color:rgba(244,63,94,0.4)",
    "中立": "background:rgba(100,116,139,0.15);color:#cbd5e1;border-color:rgba(100,116,139,0.4)",
    "偏弱": "background:rgba(16,185,129,0.15);color:#6ee7b7;border-color:rgba(16,185,129,0.4)",
    "弱":   "background:rgba(5,150,105,0.15);color:#34d399;border-color:rgba(5,150,105,0.4)",
    "未更新": "background:rgba(51,65,85,0.4);color:#94a3b8;border-color:rgba(71,85,105,0.4)"
  };

  var STAR_COLOR = {
    gold: "#fbbf24",
    neutral: "#64748b",
    dark: "#10b981",
    unknown: "#475569"
  };

  var DATE_TABS = ["focus", "alpha", "pullback", "super", "stock_future", "group"]; // 依所選日期變化的分頁；監控股池為累加型，不受日期影響

  var state = {
    error: null,
    activeTab: "focus",
    dates: [],
    selectedDate: null,
    byDate: {},   // date -> { date, generated_at, tabs: {focus, alpha, pullback, super} }
    poolTab: [],  // 監控股池：累加型，固定使用最新一次的資料，不隨日期切換
    loaded: false,
    expandedSector: null  // 族群分頁目前展開中的族群名稱（一次只展開一個）
  };

  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    attrs = attrs || {};
    for (var k in attrs) {
      if (k === "text") node.textContent = attrs[k];
      else if (k === "html") node.innerHTML = attrs[k];
      else if (k === "style") node.setAttribute("style", attrs[k]);
      else if (k.indexOf("on") === 0 && typeof attrs[k] === "function") node.addEventListener(k.slice(2), attrs[k]);
      else node.setAttribute(k, attrs[k]);
    }
    (children || []).forEach(function (c) { if (c) node.appendChild(c); });
    return node;
  }

  function yahooUrl(code, market) {
    var suffix = market === "TWO" ? "TWO" : "TW";
    return "https://tw.stock.yahoo.com/quote/" + code + "." + suffix;
  }

  function renderStars(stars) {
    var row = el("div", { class: "stars", title: "近5日強度（左：今日 → 右：4日前）" });
    stars.forEach(function (s, i) {
      var span = el("span", {
        style: "color:" + (STAR_COLOR[s.color] || "#475569") + (i === 0 ? ";transform:scale(1.15);display:inline-block" : ""),
        class: i === 0 ? "" : "dim",
        text: s.symbol
      });
      row.appendChild(span);
    });
    return row;
  }

  function renderRow(stock, isPool) {
    var badgeStyle = STRENGTH_STYLE[stock.today_strength] || STRENGTH_STYLE["未更新"];

    var idBlock = el("div", { class: "row-id" }, [
      el("span", { class: "row-market", text: stock.market === "TWO" ? "上櫃" : "上市" }),
      el("span", { class: "row-code", text: stock.code }),
      el("a", {
        class: "stock-name", href: yahooUrl(stock.code, stock.market),
        target: "_blank", rel: "noopener noreferrer", text: stock.name
      })
    ]);

    var strengthBlock = el("div", { class: "row-field" }, [
      el("span", { class: "field-label", text: "當日強度" }),
      el("span", { class: "badge", style: badgeStyle, text: stock.today_strength })
    ]);

    var starsBlock = el("div", { class: "row-field" }, [
      el("span", { class: "field-label", text: "五日強度" }),
      renderStars(stock.stars)
    ]);

    var children = [idBlock, strengthBlock, starsBlock];

    if (isPool) {
      children.push(el("div", { class: "row-field" }, [
        el("span", { class: "field-label", text: "納入日期" }),
        el("span", { class: "added-date", text: stock.added_date || "—" })
      ]));
      if (stock.pinned) {
        children.push(el("span", { class: "badge-pinned", text: "🔭 觀察中" }));
      } else if (stock.warned) {
        children.push(el("span", { class: "badge-warn", text: "⚠ 即將剔除" }));
      }
    }

    return el("div", { class: "stock-row" }, children);
  }

  function renderPctBadge(pct) {
    var up = pct >= 0;
    return el("span", {
      class: "pct-badge " + (up ? "pct-up" : "pct-down"),
      text: (up ? "+" : "") + pct.toFixed(2) + "%"
    });
  }

  function renderFutureRow(item) {
    var idBlock = el("div", { class: "row-id" }, [
      el("span", { class: "row-market", text: item.market === "TWO" ? "上櫃" : "上市" }),
      el("span", { class: "row-code", text: item.code }),
      el("a", {
        class: "stock-name", href: yahooUrl(item.code, item.market),
        target: "_blank", rel: "noopener noreferrer", text: item.name
      })
    ]);

    var pctBlock = el("div", { class: "row-field" }, [
      el("span", { class: "field-label", text: "期漲幅" }),
      renderPctBadge(item.pct_change)
    ]);

    return el("div", { class: "stock-row" }, [
      el("span", { class: "row-rank", text: String(item.rank) }),
      idBlock,
      pctBlock
    ]);
  }

  function renderSectorDetailRow(stock) {
    var nameBlock = stock.code
      ? el("a", {
          class: "detail-name", href: yahooUrl(stock.code, stock.market),
          target: "_blank", rel: "noopener noreferrer", text: stock.name
        })
      : el("span", { class: "detail-name", text: stock.name });

    return el("div", { class: "detail-row" }, [
      el("span", { class: "detail-rank", text: stock.rank + "." }),
      nameBlock,
      renderPctBadge(stock.pct_change)
    ]);
  }

  function renderGroupDetail(item) {
    var box = el("div", { class: "group-detail" });
    if (item.stocks && item.stocks.length) {
      item.stocks.forEach(function (s) { box.appendChild(renderSectorDetailRow(s)); });
    } else {
      box.appendChild(el("div", { class: "group-detail-empty", text: "No more Information, please update" }));
    }
    return box;
  }

  function renderGroupRow(item) {
    var expanded = state.expandedSector === item.sector;

    var nameBlock = el("div", { class: "row-id" }, [
      el("span", { class: "expand-caret", text: expanded ? "▾" : "▸" }),
      el("span", { class: "stock-name", text: item.sector })
    ]);

    var pctBlock = el("div", { class: "row-field" }, [
      el("span", { class: "field-label", text: "漲跌幅" }),
      renderPctBadge(item.pct_change)
    ]);

    var header = el("div", {
      class: "stock-row group-row" + (expanded ? " expanded" : ""),
      onclick: function () {
        state.expandedSector = expanded ? null : item.sector;
        renderContent();
      }
    }, [
      el("span", { class: "row-rank", text: String(item.rank) }),
      nameBlock,
      pctBlock
    ]);

    var wrap = el("div", { class: "group-row-wrap" }, [header]);
    if (expanded) {
      wrap.appendChild(renderGroupDetail(item));
    }
    return wrap;
  }

  function listForTab(key) {
    if (key === "pool") return state.poolTab;
    var d = state.byDate[state.selectedDate];
    return (d && d.tabs[key]) || [];
  }

  function renderTabs() {
    var nav = document.getElementById("tabs");
    nav.innerHTML = "";
    TABS.forEach(function (t) {
      var count = state.loaded ? listForTab(t.key).length : null;
      var btn = el("button", {
        class: "tab-btn" + (state.activeTab === t.key ? " active" : ""),
        onclick: function () { state.activeTab = t.key; render(); }
      }, [
        el("span", { text: t.icon }),
        el("span", { text: t.label }),
        count !== null ? el("span", { class: "count", text: "(" + count + ")" }) : null
      ]);
      nav.appendChild(btn);
    });
  }

  function renderContent() {
    var content = document.getElementById("content");
    content.innerHTML = "";
    if (!state.loaded) return;

    var list = listForTab(state.activeTab);
    if (list.length === 0) {
      content.appendChild(el("div", { class: "empty" }, [
        el("div", { class: "icon", text: "📭" }),
        el("p", { text: "目前此分頁尚無資料，請確認截圖資料夾或稍後再試。" })
      ]));
      return;
    }

    var rows = el("div", { class: "rows" });
    list.forEach(function (item) {
      if (state.activeTab === "stock_future") {
        rows.appendChild(renderFutureRow(item));
      } else if (state.activeTab === "group") {
        rows.appendChild(renderGroupRow(item));
      } else {
        rows.appendChild(renderRow(item, state.activeTab === "pool"));
      }
    });
    content.appendChild(rows);
  }

  function renderDateSelect() {
    var sel = document.getElementById("dateSelect");
    sel.innerHTML = "";
    state.dates.forEach(function (d) {
      var opt = el("option", { value: d, text: d });
      if (d === state.selectedDate) opt.setAttribute("selected", "selected");
      sel.appendChild(opt);
    });
    sel.disabled = state.dates.length === 0;
  }

  function render() {
    var meta = document.getElementById("meta");
    var cur = state.byDate[state.selectedDate];
    meta.textContent = cur
      ? "資料日期：" + cur.date + "　更新時間：" + cur.generated_at
      : "載入中...";

    var errorBox = document.getElementById("errorBox");
    if (state.error) {
      errorBox.style.display = "block";
      errorBox.textContent = "載入資料失敗：" + state.error + "（請確認 today_summary.json 是否存在於 docs/ 目錄）";
    } else {
      errorBox.style.display = "none";
    }

    renderDateSelect();
    renderTabs();
    renderContent();
  }

  function loadDate(date) {
    if (state.byDate[date]) { render(); return; }
    fetch("./history/" + date + ".json", { cache: "no-store" })
      .then(function (res) {
        if (!res.ok) throw new Error("找不到 " + date + " 的資料");
        return res.json();
      })
      .then(function (json) { state.byDate[date] = json; render(); })
      .catch(function (e) { state.error = e.message; render(); });
  }

  // 監控股池為累加型分頁，切換日期只影響其餘四個分頁的資料來源
  document.getElementById("dateSelect").addEventListener("change", function (e) {
    state.selectedDate = e.target.value;
    loadDate(state.selectedDate);
  });

  render();

  fetch("./today_summary.json", { cache: "no-store" })
    .then(function (res) {
      if (!res.ok) throw new Error("找不到 today_summary.json");
      return res.json();
    })
    .then(function (json) {
      state.dates = json.dates || [json.date];
      state.selectedDate = json.date;
      state.byDate[json.date] = json;
      state.poolTab = (json.tabs && json.tabs.pool) || [];
      state.loaded = true;
      render();
    })
    .catch(function (e) { state.error = e.message; render(); });
})();
</script>
</body>
</html>
