<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Elevator to Freedom</title>
<script>
  // 先套用使用者上次選的主題，避免載入時閃一下
  try {
    var savedTheme = localStorage.getItem("theme");
    if (savedTheme === "light" || savedTheme === "dark") document.documentElement.setAttribute("data-theme", savedTheme);
  } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Nunito:ital,wght@0,700;0,800;0,900;1,700&display=swap" rel="stylesheet" />
<style>
  /* Tactile Digital / Deformable UI：鉻銀＋果凍粉＋清爽藍，亮色為預設，深色跟隨系統 */
  :root {
    --chrome: #C0C0C0;
    --jelly: #FF9ECD;
    --sky: #87CEEB;
    --hl: rgba(255,255,255,0.7);
    --hl-soft: rgba(255,255,255,0.5);

    --bg-top: #e5e5e5;
    --bg-bottom: #a3a3a3;
    --text: #1f2937;
    --muted: #4b5563;
    --muted2: #6b7280;
    --accent: #c2287a;
    --border: rgba(255,255,255,0.55);
    --border-hover: rgba(135,206,235,0.9);

    --panel-a: rgba(255,158,205,0.55);
    --panel-b: rgba(192,192,192,0.55);
    --glass: rgba(255,255,255,0.35);
    --chip-a: #ffffff;
    --chip-b: #e5e5e5;
    --shadow-out: 0 20px 40px -15px rgba(0,0,0,0.4);
    --shadow-btn: 0 8px 16px -6px rgba(0,0,0,0.4);
    --shadow-row: 0 10px 24px -14px rgba(0,0,0,0.45);

    /* 台股語意：紅＝漲、綠＝跌 */
    --up-bg: rgba(225,29,72,0.14);   --up-fg: #be123c;   --up-bd: rgba(225,29,72,0.45);
    --down-bg: rgba(5,150,105,0.14); --down-fg: #047857; --down-bd: rgba(5,150,105,0.45);
    --warn-bg: rgba(220,38,38,0.12); --warn-fg: #b91c1c; --warn-bd: rgba(220,38,38,0.45);

    --s-strong-bg: rgba(217,119,6,0.15);  --s-strong-fg: #b45309;  --s-strong-bd: rgba(217,119,6,0.45);
    --s-good-bg: var(--up-bg);            --s-good-fg: var(--up-fg); --s-good-bd: var(--up-bd);
    --s-mid-bg: rgba(100,116,139,0.15);   --s-mid-fg: #475569;     --s-mid-bd: rgba(100,116,139,0.45);
    --s-weak-bg: var(--down-bg);          --s-weak-fg: var(--down-fg); --s-weak-bd: var(--down-bd);
    --s-vweak-bg: rgba(6,95,70,0.15);     --s-vweak-fg: #065f46;   --s-vweak-bd: rgba(6,95,70,0.45);
    --s-na-bg: rgba(148,163,184,0.25);    --s-na-fg: #64748b;      --s-na-bd: rgba(100,116,139,0.35);

    --star-gold: #d97706;
    --star-neutral: #94a3b8;
    --star-dark: #047857;
    --star-unknown: #9ca3af;

    --spring: cubic-bezier(.34,1.56,.64,1);
  }
  /* 深色：跟隨系統，除非使用者用右上角按鈕指定 data-theme（存在 localStorage） */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg-top: #0F172A;
      --bg-bottom: #020617;
      --text: #f1f5f9;
      --muted: #cbd5e1;
      --muted2: #94a3b8;
      --accent: #FF9ECD;
      --border: rgba(255,255,255,0.18);
      --border-hover: rgba(135,206,235,0.7);
      --hl: rgba(255,255,255,0.25);
      --hl-soft: rgba(255,255,255,0.15);

      --panel-a: rgba(255,158,205,0.16);
      --panel-b: rgba(192,192,192,0.08);
      --glass: rgba(255,255,255,0.06);
      --chip-a: rgba(255,255,255,0.16);
      --chip-b: rgba(255,255,255,0.05);
      --shadow-out: 0 20px 40px -15px rgba(0,0,0,0.8);
      --shadow-btn: 0 8px 16px -6px rgba(0,0,0,0.7);
      --shadow-row: 0 10px 24px -14px rgba(0,0,0,0.8);

      --up-bg: rgba(244,63,94,0.18);   --up-fg: #fda4af;   --up-bd: rgba(244,63,94,0.45);
      --down-bg: rgba(16,185,129,0.18); --down-fg: #6ee7b7; --down-bd: rgba(16,185,129,0.45);
      --warn-bg: rgba(239,68,68,0.18); --warn-fg: #fca5a5; --warn-bd: rgba(239,68,68,0.45);

      --s-strong-bg: rgba(251,191,36,0.16); --s-strong-fg: #fcd34d; --s-strong-bd: rgba(251,191,36,0.45);
      --s-mid-bg: rgba(100,116,139,0.2);    --s-mid-fg: #cbd5e1;    --s-mid-bd: rgba(100,116,139,0.45);
      --s-vweak-bg: rgba(5,150,105,0.18);   --s-vweak-fg: #34d399;  --s-vweak-bd: rgba(5,150,105,0.45);
      --s-na-bg: rgba(51,65,85,0.45);       --s-na-fg: #94a3b8;     --s-na-bd: rgba(71,85,105,0.45);

      --star-gold: #fbbf24;
      --star-neutral: #64748b;
      --star-dark: #10b981;
      --star-unknown: #475569;
    }
  }
  :root[data-theme="dark"] {
    --bg-top: #0F172A;
    --bg-bottom: #020617;
    --text: #f1f5f9;
    --muted: #cbd5e1;
    --muted2: #94a3b8;
    --accent: #FF9ECD;
    --border: rgba(255,255,255,0.18);
    --border-hover: rgba(135,206,235,0.7);
    --hl: rgba(255,255,255,0.25);
    --hl-soft: rgba(255,255,255,0.15);

    --panel-a: rgba(255,158,205,0.16);
    --panel-b: rgba(192,192,192,0.08);
    --glass: rgba(255,255,255,0.06);
    --chip-a: rgba(255,255,255,0.16);
    --chip-b: rgba(255,255,255,0.05);
    --shadow-out: 0 20px 40px -15px rgba(0,0,0,0.8);
    --shadow-btn: 0 8px 16px -6px rgba(0,0,0,0.7);
    --shadow-row: 0 10px 24px -14px rgba(0,0,0,0.8);

    --up-bg: rgba(244,63,94,0.18);   --up-fg: #fda4af;   --up-bd: rgba(244,63,94,0.45);
    --down-bg: rgba(16,185,129,0.18); --down-fg: #6ee7b7; --down-bd: rgba(16,185,129,0.45);
    --warn-bg: rgba(239,68,68,0.18); --warn-fg: #fca5a5; --warn-bd: rgba(239,68,68,0.45);

    --s-strong-bg: rgba(251,191,36,0.16); --s-strong-fg: #fcd34d; --s-strong-bd: rgba(251,191,36,0.45);
    --s-mid-bg: rgba(100,116,139,0.2);    --s-mid-fg: #cbd5e1;    --s-mid-bd: rgba(100,116,139,0.45);
    --s-vweak-bg: rgba(5,150,105,0.18);   --s-vweak-fg: #34d399;  --s-vweak-bd: rgba(5,150,105,0.45);
    --s-na-bg: rgba(51,65,85,0.45);       --s-na-fg: #94a3b8;     --s-na-bd: rgba(71,85,105,0.45);

    --star-gold: #fbbf24;
    --star-neutral: #64748b;
    --star-dark: #10b981;
    --star-unknown: #475569;
  }

  * { box-sizing: border-box; }
  html { background: var(--bg-bottom); }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(ellipse at 50% -10%, rgba(255,255,255,0.35), transparent 60%),
                linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
    background-attachment: fixed;
    color: var(--text);
    font-family: "DM Sans", "PingFang TC", "Microsoft JhengHei", -apple-system, "Segoe UI", Roboto, sans-serif;
    font-weight: 500;
    font-size: 16px;
    overflow-x: hidden;
  }
  ::-webkit-scrollbar { height: 6px; width: 6px; }
  ::-webkit-scrollbar-thumb { background: var(--jelly); border-radius: 999px; }

  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px 60px; }
  @media (min-width: 640px) { .wrap { padding: 40px 24px 60px; } }

  /* 標題區：不規則果凍主卡片 */
  header {
    position: relative;
    isolation: isolate;
    margin-bottom: 28px;
    padding: 28px 28px 30px;
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
    justify-content: space-between;
    gap: 14px;
    background: linear-gradient(135deg, var(--jelly), var(--chrome));
    border: 1px solid rgba(255,255,255,0.5);
    border-radius: 36px 28px 40px 24px / 30px 40px 26px 36px;
    box-shadow: inset 0 2px 8px rgba(255,255,255,0.6), var(--shadow-out);
    overflow: hidden;
  }
  @media (min-width: 640px) {
    header {
      padding: 40px 48px 42px;
      border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
      animation: jelly-morph 14s ease-in-out infinite;
    }
  }
  header::before {
    content: "";
    position: absolute;
    inset: 6px 10% auto 8%;
    height: 40%;
    border-radius: 999px;
    background: linear-gradient(180deg, rgba(255,255,255,0.55), rgba(255,255,255,0));
    pointer-events: none;
    z-index: -1;
  }
  .jelly-blob {
    position: absolute;
    border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
    border: 1px solid rgba(255,255,255,0.5);
    box-shadow: inset 0 2px 8px rgba(255,255,255,0.6);
    pointer-events: none;
    z-index: -1;
    animation: jelly-morph 10s ease-in-out infinite;
  }
  .jelly-blob.b1 { width: 140px; height: 120px; right: -30px; bottom: -40px; background: linear-gradient(135deg, var(--sky), rgba(255,255,255,0.6)); opacity: 0.75; }
  .jelly-blob.b2 { width: 70px; height: 64px; right: 30%; top: -26px; background: linear-gradient(135deg, #fff, var(--jelly)); opacity: 0.6; animation-delay: -4s; }
  @keyframes jelly-morph {
    0%, 100% { border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; }
    50%      { border-radius: 40% 60% 70% 30% / 40% 60% 40% 60%; }
  }

  header h1 {
    font-family: "Nunito", "PingFang TC", "Microsoft JhengHei", sans-serif;
    font-size: 32px;
    font-weight: 900;
    line-height: 1.1;
    margin: 0;
    color: #fff;
    text-shadow: 0 2px 0 rgba(194,40,122,0.35), 0 6px 18px rgba(0,0,0,0.25);
  }
  @media (min-width: 640px) { header h1 { font-size: 48px; } }
  header p { color: #3f3f46; font-size: 0.9rem; margin: 8px 0 0; }

  .date-picker { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .date-picker label { font-size: 0.8rem; color: #3f3f46; white-space: nowrap; font-weight: 700; }
  .date-picker select {
    appearance: none;
    -webkit-appearance: none;
    font: inherit;
    font-size: 0.875rem;
    color: #1f2937;
    background: linear-gradient(180deg, #ffffff, #e5e5e5);
    border: 1px solid rgba(255,255,255,0.8);
    border-radius: 999px;
    padding: 8px 16px;
    cursor: pointer;
    box-shadow: inset 0 1px 2px rgba(255,255,255,0.8), var(--shadow-btn);
    transition: transform 400ms var(--spring), box-shadow 200ms ease;
  }
  .date-picker select:hover { transform: scale(1.05); }
  .date-picker select:active { transform: scale(0.95); box-shadow: inset 0 3px 8px rgba(0,0,0,0.25); }
  .date-picker select:disabled { opacity: 0.6; cursor: default; transform: none; }

  .theme-toggle {
    width: 40px;
    height: 40px;
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 1.15rem;
    line-height: 1;
    padding: 0;
    border-radius: 999px;
    background: linear-gradient(180deg, #ffffff, #e5e5e5);
    border: 1px solid rgba(255,255,255,0.8);
    box-shadow: inset 0 1px 2px rgba(255,255,255,0.8), var(--shadow-btn);
    cursor: pointer;
    transition: transform 400ms var(--spring), box-shadow 200ms ease;
  }
  .theme-toggle:hover { transform: scale(1.05) rotate(-8deg); }
  .theme-toggle:active { transform: scale(0.95); box-shadow: inset 0 3px 8px rgba(0,0,0,0.25); }

  .error-box {
    background: var(--warn-bg);
    border: 1px solid var(--warn-bd);
    color: var(--warn-fg);
    border-radius: 2rem;
    padding: 14px 22px;
    margin-bottom: 20px;
    font-size: 0.9rem;
    box-shadow: inset 0 1px 4px var(--hl-soft);
  }

  /* 分頁：鉻金屬 CTA 膠囊 */
  nav.tabs {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding: 6px 16px 14px;
    margin: 0 -16px 18px;
  }
  @media (min-width: 640px) { nav.tabs { margin: 0 -6px 18px; padding-left: 6px; padding-right: 6px; flex-wrap: wrap; } }
  .tab-btn {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 10px 18px;
    border-radius: 999px;
    font: inherit;
    font-size: 0.9rem;
    font-weight: 700;
    color: #374151;
    background: linear-gradient(180deg, #ffffff, #e5e5e5);
    border: 1px solid rgba(255,255,255,0.8);
    box-shadow: inset 0 1px 2px rgba(255,255,255,0.8), var(--shadow-btn);
    cursor: pointer;
    white-space: nowrap;
    transition: transform 400ms var(--spring), box-shadow 200ms ease, background 200ms ease;
  }
  .tab-btn:hover {
    transform: scale(1.05);
    background: linear-gradient(180deg, #ffffff, var(--sky));
  }
  .tab-btn:active {
    transform: scale(0.95);
    box-shadow: inset 0 3px 8px rgba(0,0,0,0.25), 0 2px 4px -2px rgba(0,0,0,0.3);
  }
  .tab-btn.active {
    color: #fff;
    background: linear-gradient(180deg, #ffc2e0, var(--jelly) 55%, #f472b6);
    text-shadow: 0 1px 1px rgba(157,23,77,0.4);
    animation: jelly-pop 400ms var(--spring);
  }
  .tab-btn .count { opacity: 0.75; font-size: 0.78rem; }
  @keyframes jelly-pop {
    0%   { transform: scale(0.92); }
    60%  { transform: scale(1.06); }
    100% { transform: scale(1); }
  }

  .empty {
    text-align: center;
    padding: 60px 16px;
    color: var(--muted);
    background: var(--glass);
    border: 1px solid var(--border);
    border-radius: 3rem;
    box-shadow: inset 0 1px 4px var(--hl-soft);
  }
  .empty .icon { font-size: 2.5rem; margin-bottom: 10px; }
  .notice {
    margin: 0 0 12px;
    padding: 10px 20px;
    border-radius: 2rem;
    font-size: 0.85rem;
    color: var(--muted);
    background: var(--glass);
    border: 1px solid var(--border);
    box-shadow: inset 0 1px 4px var(--hl-soft);
  }

  .rows {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  /* 股票列：特色卡片（膠囊果凍） */
  .stock-row {
    background: linear-gradient(135deg, var(--panel-a), var(--panel-b));
    border: 1px solid var(--border);
    border-radius: 3rem;
    padding: 12px 26px;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 14px 20px;
    box-shadow: inset 0 1px 4px var(--hl-soft), var(--shadow-row);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    transition: transform 400ms var(--spring), border-color 200ms ease;
  }
  .stock-row:hover { transform: scale(1.01); border-color: var(--border-hover); }

  .row-rank {
    flex-shrink: 0;
    width: 32px;
    height: 32px;
    line-height: 32px;
    text-align: center;
    font-family: "Nunito", sans-serif;
    font-weight: 900;
    color: #fff;
    border-radius: 999px;
    background: linear-gradient(180deg, #ffc2e0, var(--jelly) 60%, #f472b6);
    box-shadow: inset 0 1px 2px rgba(255,255,255,0.8), 0 4px 8px -4px rgba(0,0,0,0.4);
    font-variant-numeric: tabular-nums;
  }

  .row-id { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1 1 220px; }
  .row-market {
    flex-shrink: 0;
    font-size: 0.7rem;
    color: var(--muted);
    background: linear-gradient(180deg, var(--chip-a), var(--chip-b));
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 1px 8px;
    box-shadow: inset 0 1px 2px var(--hl);
  }
  .row-code { flex-shrink: 0; font-size: 0.85rem; color: var(--muted); }
  .stock-name {
    font-family: "Nunito", "PingFang TC", "Microsoft JhengHei", sans-serif;
    font-weight: 800;
    font-size: 1.05rem;
    color: var(--text);
    text-decoration: none;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
  }
  .stock-name:hover { color: var(--accent); text-decoration: underline; }
  .pin-icon { flex-shrink: 0; font-size: 0.85rem; cursor: default; }

  .row-field { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; flex-shrink: 0; }
  .row-field .field-label { font-size: 0.68rem; color: var(--muted2); }
  .turnover-field { min-width: 84px; align-items: flex-end; }
  .turnover-value { font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }

  .row-tags { flex: 1 1 160px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .tag-chip {
    font-size: 0.74rem;
    padding: 3px 10px;
    border-radius: 999px;
    white-space: nowrap;
    color: var(--muted);
    background: linear-gradient(180deg, var(--chip-a), var(--chip-b));
    border: 1px solid var(--border);
    box-shadow: inset 0 1px 2px var(--hl);
  }

  .badge {
    padding: 3px 12px;
    border-radius: 999px;
    font-size: 0.78rem;
    font-weight: 700;
    white-space: nowrap;
    border: 1px solid;
    box-shadow: inset 0 1px 2px var(--hl-soft);
  }
  .pct-badge {
    padding: 3px 12px;
    border-radius: 999px;
    font-size: 0.82rem;
    font-weight: 700;
    white-space: nowrap;
    border: 1px solid;
    font-variant-numeric: tabular-nums;
    box-shadow: inset 0 1px 2px var(--hl-soft);
  }
  .pct-up   { background: var(--up-bg);   color: var(--up-fg);   border-color: var(--up-bd); }
  .pct-down { background: var(--down-bg); color: var(--down-fg); border-color: var(--down-bd); }

  .badge-warn {
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 0.7rem;
    font-weight: 700;
    white-space: nowrap;
    background: var(--warn-bg);
    color: var(--warn-fg);
    border: 1px solid var(--warn-bd);
    flex-shrink: 0;
    margin-left: auto;
  }
  .stars { display: flex; align-items: center; gap: 3px; font-size: 1.1rem; line-height: 1; }
  .stars span.dim { opacity: 0.85; }
  .added-date { font-size: 0.8rem; color: var(--text); }

  .group-row-wrap { display: flex; flex-direction: column; }
  .group-row { cursor: pointer; }
  .group-row:active { transform: scale(0.98); box-shadow: inset 0 3px 10px rgba(0,0,0,0.2); }
  .group-row.expanded {
    border-color: var(--border-hover);
    border-bottom-left-radius: 1rem;
    border-bottom-right-radius: 1rem;
    transform: none;
  }
  .expand-caret { color: var(--muted); font-size: 0.7rem; width: 10px; flex-shrink: 0; }

  .group-detail {
    margin: 4px 14px 0;
    border: 1px solid var(--border-hover);
    border-radius: 1rem 1rem 2rem 2rem;
    background: var(--glass);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    box-shadow: inset 0 1px 4px var(--hl-soft);
    padding: 8px 22px 14px 40px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    animation: jelly-pop 400ms var(--spring);
    transform-origin: top center;
  }
  .detail-row { display: flex; align-items: center; gap: 10px; padding: 5px 0; }
  .detail-rank { color: var(--muted); font-size: 0.82rem; width: 18px; flex-shrink: 0; }
  .detail-name {
    flex: 1;
    min-width: 0;
    font-weight: 500;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .group-detail-empty { color: var(--muted); font-style: italic; font-size: 0.88rem; padding: 8px 0; }

  footer {
    margin-top: 48px;
    text-align: center;
    font-size: 0.75rem;
    color: var(--muted);
    line-height: 1.7;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .tab-btn:hover, .stock-row:hover, .date-picker select:hover { transform: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="jelly-blob b1" aria-hidden="true"></span>
    <span class="jelly-blob b2" aria-hidden="true"></span>
    <div>
      <h1>Elevator to Freedom</h1>
      <p id="meta">載入中...</p>
    </div>
    <div class="date-picker">
      <label for="dateSelect">資料日期</label>
      <select id="dateSelect" disabled></select>
      <button type="button" id="themeToggle" class="theme-toggle" aria-label="切換深色／亮色模式"></button>
    </div>
  </header>

  <div id="errorBox" style="display:none" class="error-box"></div>

  <nav class="tabs" id="tabs"></nav>

  <div id="content"></div>

  <footer>
    <p>近5日強度星星：左（今日）→ 右（4日前）　★金＝偏強/極強　☆灰＝中立　★深＝偏弱/極弱　❓＝未更新</p>
    <p>資料來源：TWSE / TPEX 三大法人買賣超公開資訊，僅供參考，不構成投資建議。</p>
  </footer>
</div>

<script>
(function () {
  "use strict";

  // 深色／亮色切換：未手動選過時跟隨系統，按鈕切換後記在 localStorage
  var themeBtn = document.getElementById("themeToggle");
  var darkQuery = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;

  function currentTheme() {
    var t = document.documentElement.getAttribute("data-theme");
    if (t === "light" || t === "dark") return t;
    return darkQuery && darkQuery.matches ? "dark" : "light";
  }

  function syncThemeButton() {
    var dark = currentTheme() === "dark";
    themeBtn.textContent = dark ? "☀️" : "🌙";
    themeBtn.title = dark ? "切換成亮色" : "切換成深色";
  }

  themeBtn.addEventListener("click", function () {
    var next = currentTheme() === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem("theme", next); } catch (e) {}
    syncThemeButton();
  });
  if (darkQuery && darkQuery.addEventListener) darkQuery.addEventListener("change", syncThemeButton);
  syncThemeButton();

  var TABS = [
    { key: "focus",    label: "Focus",        icon: "🎯" },
    { key: "alpha",    label: "alpha power",  icon: "⚡" },
    { key: "pullback", label: "pullback",     icon: "📉" },
    { key: "super",        label: "Super Man",     icon: "🌟" },
    { key: "stock_future", label: "stock future",  icon: "📈" },
    { key: "group",        label: "Circle group",  icon: "🧩" },
    { key: "pool",         label: "watchout pool", icon: "🗂️" }
  ];

  var STRENGTH_STYLE = {
    "極強": "background:var(--s-strong-bg);color:var(--s-strong-fg);border-color:var(--s-strong-bd)",
    "偏強": "background:var(--s-good-bg);color:var(--s-good-fg);border-color:var(--s-good-bd)",
    "中立": "background:var(--s-mid-bg);color:var(--s-mid-fg);border-color:var(--s-mid-bd)",
    "偏弱": "background:var(--s-weak-bg);color:var(--s-weak-fg);border-color:var(--s-weak-bd)",
    "極弱": "background:var(--s-vweak-bg);color:var(--s-vweak-fg);border-color:var(--s-vweak-bd)",
    "未更新": "background:var(--s-na-bg);color:var(--s-na-fg);border-color:var(--s-na-bd)"
  };

  var STAR_COLOR = {
    gold: "var(--star-gold)",
    neutral: "var(--star-neutral)",
    dark: "var(--star-dark)",
    unknown: "var(--star-unknown)"
  };

  var DATE_TABS = ["focus", "alpha", "pullback", "super", "stock_future", "group"]; // 依所選日期變化的分頁；監控股池為累加型，不受日期影響

  var state = {
    error: null,
    activeTab: "focus",
    dates: [],
    selectedDate: null,
    byDate: {},   // date -> { date, generated_at, tabs: {focus, alpha, pullback, super} }
    poolTab: [],  // 監控股池：累加型，固定使用最新一次的資料，不隨日期切換
    loaded: false,
    expandedSector: null  // 族群分頁目前展開中的族群名稱（一次只展開一個）
  };

  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    attrs = attrs || {};
    for (var k in attrs) {
      if (k === "text") node.textContent = attrs[k];
      else if (k === "html") node.innerHTML = attrs[k];
      else if (k === "style") node.setAttribute("style", attrs[k]);
      else if (k.indexOf("on") === 0 && typeof attrs[k] === "function") node.addEventListener(k.slice(2), attrs[k]);
      else node.setAttribute(k, attrs[k]);
    }
    (children || []).forEach(function (c) { if (c) node.appendChild(c); });
    return node;
  }

  function yahooUrl(code, market) {
    var suffix = market === "TWO" ? "TWO" : "TW";
    return "https://tw.stock.yahoo.com/quote/" + code + "." + suffix;
  }

  function renderStars(stars) {
    var row = el("div", { class: "stars", title: "近5日強度（左：今日 → 右：4日前）" });
    stars.forEach(function (s, i) {
      var span = el("span", {
        style: "color:" + (STAR_COLOR[s.color] || STAR_COLOR.unknown) + (i === 0 ? ";transform:scale(1.15);display:inline-block" : ""),
        class: i === 0 ? "" : "dim",
        text: s.symbol
      });
      row.appendChild(span);
    });
    return row;
  }

  // 監控股池標籤顯示順序；group（族群）檢查的是各族群的成分股
  var POOL_CROSS_CHECK_KEYS = ["alpha", "stock_future", "focus", "group", "pullback"];

  function poolCrossTabs(code) {
    var d = state.byDate[state.selectedDate];
    if (!d || !d.tabs) return [];
    var found = [];
    POOL_CROSS_CHECK_KEYS.forEach(function (key) {
      var list = d.tabs[key] || [];
      var hit = key === "group"
        ? list.some(function (sector) {
            return (sector.stocks || []).some(function (s) { return s.code === code; });
          })
        : list.some(function (item) { return item.code === code; });
      if (hit) {
        var tabDef = TABS.filter(function (t) { return t.key === key; })[0];
        if (tabDef) found.push(tabDef);
      }
    });
    return found;
  }

  // 監控股池排序：觀察中（pinned）股票排最前面，其餘接在後面；兩組內都維持原本順序
  // （後端已依當日強度→代號排好，未更新排最後）
  function sortPoolList(list) {
    var keyed = list.map(function (stock, i) {
      return { stock: stock, pinned: stock.pinned ? 1 : 0, i: i };
    });
    keyed.sort(function (a, b) {
      return (b.pinned - a.pinned) || (a.i - b.i);
    });
    return keyed.map(function (k) { return k.stock; });
  }

  function renderPoolTagsBlock(code) {
    var box = el("div", { class: "row-tags" });
    poolCrossTabs(code).forEach(function (t) {
      box.appendChild(el("span", { class: "tag-chip", text: t.icon + " " + t.label }));
    });
    return box;
  }

  function renderRow(stock, isPool) {
    var badgeStyle = STRENGTH_STYLE[stock.today_strength] || STRENGTH_STYLE["未更新"];

    var idBlock = el("div", { class: "row-id" }, [
      el("span", { class: "row-market", text: stock.market === "TWO" ? "上櫃" : "上市" }),
      el("span", { class: "row-code", text: stock.code }),
      el("a", {
        class: "stock-name", href: yahooUrl(stock.code, stock.market),
        target: "_blank", rel: "noopener noreferrer", text: stock.name
      }),
      stock.pinned ? el("span", { class: "pin-icon", title: "觀察中（不受5日剔除規則影響）", text: "📌" }) : null
    ]);

    var strengthBlock = el("div", { class: "row-field" }, [
      el("span", { class: "field-label", text: "當日強度" }),
      el("span", { class: "badge", style: badgeStyle, text: stock.today_strength })
    ]);

    var starsBlock = el("div", { class: "row-field" }, [
      el("span", { class: "field-label", text: "五日強度" }),
      renderStars(stock.stars)
    ]);

    var children = [idBlock];
    if (isPool) {
      children.push(renderPoolTagsBlock(stock.code));
    }
    children.push(strengthBlock, starsBlock);

    if (isPool) {
      children.push(el("div", { class: "row-field" }, [
        el("span", { class: "field-label", text: "納入日期" }),
        el("span", { class: "added-date", text: stock.added_date || "—" })
      ]));
      if (!stock.pinned && stock.warned) {
        children.push(el("span", { class: "badge-warn", text: "⚠ 即將剔除" }));
      }
    }

    return el("div", { class: "stock-row" }, children);
  }

  function renderPctBadge(pct) {
    if (pct === null || pct === undefined) return el("span", { class: "pct-badge", text: "—" });
    var up = pct >= 0;
    return el("span", {
      class: "pct-badge " + (up ? "pct-up" : "pct-down"),
      text: (up ? "+" : "") + pct.toFixed(2) + "%"
    });
  }

  function renderFutureRow(item) {
    var idBlock = el("div", { class: "row-id" }, [
      el("span", { class: "row-market", text: item.market === "TWO" ? "上櫃" : "上市" }),
      el("span", { class: "row-code", text: item.code }),
      el("a", {
        class: "stock-name", href: yahooUrl(item.code, item.market),
        target: "_blank", rel: "noopener noreferrer", text: item.name
      })
    ]);

    var pctBlock = el("div", { class: "row-field" }, [
      el("span", { class: "field-label", text: "期漲幅" }),
      renderPctBadge(item.pct_change)
    ]);

    return el("div", { class: "stock-row" }, [
      el("span", { class: "row-rank", text: String(item.rank) }),
      idBlock,
      pctBlock
    ]);
  }

  function renderSectorDetailRow(stock) {
    var nameBlock = stock.code
      ? el("a", {
          class: "detail-name", href: yahooUrl(stock.code, stock.market),
          target: "_blank", rel: "noopener noreferrer", text: stock.name
        })
      : el("span", { class: "detail-name", text: stock.name });

    return el("div", { class: "detail-row" }, [
      el("span", { class: "detail-rank", text: stock.rank + "." }),
      nameBlock,
      renderPctBadge(stock.pct_change)
    ]);
  }

  function renderGroupDetail(item) {
    var box = el("div", { class: "group-detail" });
    if (item.stocks && item.stocks.length) {
      item.stocks.forEach(function (s) { box.appendChild(renderSectorDetailRow(s)); });
    } else {
      box.appendChild(el("div", { class: "group-detail-empty", text: "No more Information, please update" }));
    }
    return box;
  }

  function renderGroupRow(item) {
    var expanded = state.expandedSector === item.sector;

    var nameBlock = el("div", { class: "row-id" }, [
      el("span", { class: "expand-caret", text: expanded ? "▾" : "▸" }),
      el("span", { class: "stock-name", text: item.sector })
    ]);

    // 依成交金額排名；舊日期的資料沒有 turnover 欄位（當時依漲幅排名），顯示「—」
    var turnoverText = typeof item.turnover === "number"
      ? item.turnover.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 })
      : "—";
    var turnoverBlock = el("div", { class: "row-field turnover-field" }, [
      el("span", { class: "field-label", text: "成交額（億）" }),
      el("span", { class: "turnover-value", text: turnoverText })
    ]);

    var pctBlock = el("div", { class: "row-field" }, [
      el("span", { class: "field-label", text: "漲跌幅" }),
      renderPctBadge(item.pct_change)
    ]);

    var header = el("div", {
      class: "stock-row group-row" + (expanded ? " expanded" : ""),
      onclick: function () {
        state.expandedSector = expanded ? null : item.sector;
        renderContent();
      }
    }, [
      el("span", { class: "row-rank", text: String(item.rank) }),
      nameBlock,
      turnoverBlock,
      pctBlock
    ]);

    var wrap = el("div", { class: "group-row-wrap" }, [header]);
    if (expanded) {
      wrap.appendChild(renderGroupDetail(item));
    }
    return wrap;
  }

  function listForTab(key) {
    if (key === "pool") return state.poolTab;
    var d = state.byDate[state.selectedDate];
    return (d && d.tabs[key]) || [];
  }

  // 該分頁當天截圖資料夾是空的、更新時被略過（tabs.not_updated）→ 顯示「未更新」。
  // 監控股池為累加型，固定看最新資料日期的標記。
  function isNotUpdated(key) {
    var date = key === "pool" ? (state.dates[0] || state.selectedDate) : state.selectedDate;
    var d = state.byDate[date];
    return !!(d && d.tabs && (d.tabs.not_updated || []).indexOf(key) >= 0);
  }

  function renderTabs() {
    var nav = document.getElementById("tabs");
    nav.innerHTML = "";
    TABS.forEach(function (t) {
      var count = !state.loaded ? null : (isNotUpdated(t.key) && t.key !== "pool" ? "未更新" : listForTab(t.key).length);
      var btn = el("button", {
        class: "tab-btn" + (state.activeTab === t.key ? " active" : ""),
        onclick: function () { state.activeTab = t.key; render(); }
      }, [
        el("span", { text: t.icon }),
        el("span", { text: t.label }),
        count !== null ? el("span", { class: "count", text: "(" + count + ")" }) : null
      ]);
      nav.appendChild(btn);
    });
  }

  function renderContent() {
    var content = document.getElementById("content");
    content.innerHTML = "";
    if (!state.loaded) return;

    var notUpdated = isNotUpdated(state.activeTab);
    if (notUpdated && state.activeTab !== "pool") {
      content.appendChild(el("div", { class: "empty" }, [
        el("div", { class: "icon", text: "⏸️" }),
        el("p", { text: "未更新：" + state.selectedDate + " 沒有提供此分頁的截圖。" })
      ]));
      return;
    }
    if (notUpdated) {
      content.appendChild(el("div", { class: "notice", text:
        "未更新：" + (state.dates[0] || "") + " 沒有 Super／補漏截圖，監控股池當天未執行未更新標記與剔除判斷，以下為前次狀態。" }));
    }

    var list = listForTab(state.activeTab);
    if (state.activeTab === "pool") list = sortPoolList(list);
    if (list.length === 0) {
      content.appendChild(el("div", { class: "empty" }, [
        el("div", { class: "icon", text: "📭" }),
        el("p", { text: "目前此分頁尚無資料，請確認截圖資料夾或稍後再試。" })
      ]));
      return;
    }

    var rows = el("div", { class: "rows" });
    list.forEach(function (item) {
      if (state.activeTab === "stock_future") {
        rows.appendChild(renderFutureRow(item));
      } else if (state.activeTab === "group") {
        rows.appendChild(renderGroupRow(item));
      } else {
        rows.appendChild(renderRow(item, state.activeTab === "pool"));
      }
    });
    content.appendChild(rows);
  }

  function renderDateSelect() {
    var sel = document.getElementById("dateSelect");
    sel.innerHTML = "";
    state.dates.forEach(function (d) {
      var opt = el("option", { value: d, text: d });
      if (d === state.selectedDate) opt.setAttribute("selected", "selected");
      sel.appendChild(opt);
    });
    sel.disabled = state.dates.length === 0;
  }

  function render() {
    var meta = document.getElementById("meta");
    var cur = state.byDate[state.selectedDate];
    meta.textContent = cur
      ? "資料日期：" + cur.date + "　更新時間：" + cur.generated_at
      : "載入中...";

    var errorBox = document.getElementById("errorBox");
    if (state.error) {
      errorBox.style.display = "block";
      errorBox.textContent = "載入資料失敗：" + state.error + "（請確認 today_summary.json 是否存在於 docs/ 目錄）";
    } else {
      errorBox.style.display = "none";
    }

    renderDateSelect();
    renderTabs();
    renderContent();
  }

  function loadDate(date) {
    if (state.byDate[date]) { render(); return; }
    fetch("./history/" + date + ".json", { cache: "no-store" })
      .then(function (res) {
        if (!res.ok) throw new Error("找不到 " + date + " 的資料");
        return res.json();
      })
      .then(function (json) { state.byDate[date] = json; render(); })
      .catch(function (e) { state.error = e.message; render(); });
  }

  // 監控股池為累加型分頁，切換日期只影響其餘四個分頁的資料來源
  document.getElementById("dateSelect").addEventListener("change", function (e) {
    state.selectedDate = e.target.value;
    loadDate(state.selectedDate);
  });

  render();

  fetch("./today_summary.json", { cache: "no-store" })
    .then(function (res) {
      if (!res.ok) throw new Error("找不到 today_summary.json");
      return res.json();
    })
    .then(function (json) {
      state.dates = json.dates || [json.date];
      state.selectedDate = json.date;
      state.byDate[json.date] = json;
      state.poolTab = (json.tabs && json.tabs.pool) || [];
      state.loaded = true;
      render();
    })
    .catch(function (e) { state.error = e.message; render(); });
})();
</script>
</body>
</html>
